<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Support Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --base:#0f1720; --panel:#16202b; --panel2:#121a23; --line:#22303c;
    --text:#e8edf2; --muted:#8b9aa8; --muted2:#6f8090;
    --accent:#4a9eff; --green:#3fb37f; --red:#e05252; --amber:#e0a83f;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--base); color:var(--text);
    font-family:'IBM Plex Sans',system-ui,sans-serif; padding:20px 22px 40px;
  }
  ::selection { background:#4a9eff44; }
  textarea:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:#2a3a48; border-radius:8px; }

  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px; }
  .brand { font-size:20px; font-weight:700; letter-spacing:-.3px; }
  .sub { font-size:12px; color:var(--muted2); margin-top:2px; }
  .controls { display:flex; align-items:center; gap:12px; }

  .toggle { display:inline-flex; background:var(--panel2); border-radius:10px; padding:3px; border:1px solid var(--line); }
  .toggle button { border:none; background:transparent; color:var(--muted); padding:7px 16px;
    font-size:13px; font-weight:600; border-radius:7px; cursor:pointer; }
  .toggle button.active { background:#25384a; color:#fff; }

  .conn { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:8px; background:var(--muted2); }
  .dot.live { background:var(--green); box-shadow:0 0 8px #3fb37f88; }
  .dot.mock { background:var(--amber); box-shadow:0 0 8px #e0a83f88; }

  .stage { display:grid; gap:18px; align-items:start; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; min-height:440px; display:flex; flex-direction:column; }
  .panelLabel { font-size:12px; font-weight:600; color:var(--muted); padding:12px 16px;
    border-bottom:1px solid var(--line); background:var(--panel2);
    display:flex; justify-content:space-between; align-items:center; }
  .spinner { font-size:11px; color:var(--accent); }

  .chat { flex:1; padding:16px; display:flex; flex-direction:column; gap:10px; overflow-y:auto; }
  .bCust { align-self:flex-start; max-width:85%; background:#25384a; padding:11px 14px;
    border-radius:4px 14px 14px 14px; font-size:14px; line-height:1.5; }
  .bAgent { align-self:flex-end; max-width:85%; background:#1d4e3a; padding:11px 14px;
    border-radius:14px 4px 14px 14px; font-size:14px; line-height:1.5; }

  .composer { border-top:1px solid var(--line); padding:12px; background:var(--panel2); }
  .composer textarea { width:100%; background:var(--base); border:1px solid #2a3a48;
    border-radius:8px; color:var(--text); padding:10px 12px; font-size:14px; resize:vertical; font-family:inherit; }
  .sendBtn { margin-top:8px; width:100%; background:var(--accent); color:#08111a; border:none;
    border-radius:8px; padding:10px; font-size:14px; font-weight:700; cursor:pointer; }

  .risk { display:flex; border-bottom:1px solid var(--line); background:var(--panel2); flex-wrap:wrap; }
  .cell { flex:1; min-width:120px; padding:12px 14px; border-right:1px solid var(--line); }
  .cell .lbl { font-size:11px; color:var(--muted2); margin-bottom:6px; }
  .cell .val { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:600; text-transform:capitalize; }
  .sig { width:8px; height:8px; border-radius:8px; }

  .agentBody { display:grid; grid-template-columns:1fr 1.25fr; flex:1; min-height:0; }
  .ground { padding:16px; border-right:1px solid var(--line); overflow-y:auto; }
  .reply { padding:16px; display:flex; flex-direction:column; }
  .secTitle { font-size:12px; font-weight:600; color:var(--muted2); margin-bottom:10px; }

  .faq { background:var(--base); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; }
  .faqTop { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .faqId { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent); font-weight:600; }
  .faqMatch { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--green); font-weight:600; }
  .faqTitle { font-size:14px; font-weight:600; margin-bottom:3px; }
  .faqBody { font-size:13px; color:#9fb0be; line-height:1.45; }
  .faqEmpty { background:#231a1a; border:1px solid #4a2c2c; border-radius:10px; padding:14px;
    font-size:13px; color:#e0a0a0; line-height:1.5; }

  .order { margin-top:6px; background:var(--base); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .orderRow { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; color:#9fb0be; }
  .orderRow b { color:var(--text); }

  .replyBox { flex:1; min-height:150px; background:var(--base); border:1px solid #3a5570;

  .replyActions { display:flex; gap:10px; margin-top:12px; }
  .ghost { background:transparent; border:1px solid #2a3a48; color:var(--muted); border-radius:8px;

  .primary { flex:1; background:var(--green); color:#06140d; border:none; border-radius:8px;

  .policyNote { margin-top:14px; font-size:12px; color:#7f909e; line-height:1.5;

  .policyTag { display:inline-block; font-size:11px; font-weight:600; color:var(--green);

  .scoreStrip { display:flex; gap:14px; margin-top:12px; padding:12px; background:var(--panel2);
    border:1px solid var(--line); border-radius:10px; }
  .score { font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--muted); }
  .score b { color:var(--text); font-size:15px; }
  .tip { margin-top:8px; font-size:13px; color:#c9d4de; line-height:1.5; }

  .modeCard:hover { border-color:var(--accent); transform:translateY(-2px); }

  .field input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .loginErr { background:#2e1a1a; border:1px solid #5c2f2f; color:#f0a0a0; border-radius:8px;

  .linkBtn { background:none; border:none; color:var(--accent); font:inherit; font-size:12px;

  .cardNote { font-size:11px; color:var(--muted2); margin-bottom:14px; line-height:1.5; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--muted); }

  .swatch { width:10px; height:10px; border-radius:3px; display:inline-block; }
  .empty { padding:26px 14px; text-align:center; color:var(--muted2); font-size:13px; line-height:1.6;

  .empty b { color:var(--muted); font-weight:600; }
  .smallMult { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
  .smBox { background:var(--base); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .smLabel { font-size:11px; color:var(--muted2); margin-bottom:2px; }
  .smValue { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.5px; }
  .smValue span { font-size:12px; color:var(--muted2); font-weight:500; }
  .tipRow { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line);

  .hbar { display:grid; grid-template-columns:96px 1fr 34px; gap:10px; align-items:center;

  .hbar .track { display:block; background:#0f1720; border-radius:5px; height:10px; overflow:hidden; }
  .hbar .fill { display:block; height:100%; border-radius:5px; min-width:3px; }
  .hbar .num { text-align:right; color:var(--text); font-variant-numeric:tabular-nums; font-weight:600; }
  .who { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
  .avatar { width:26px; height:26px; border-radius:26px; background:#25384a; color:#cfe0f0;
    display:grid; place-items:center; font-size:11px; font-weight:700; }

  /* ---------- ticket queue dashboard ---------- */
  .qStats { display:flex; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .qStat { flex:1; min-width:150px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:14px 16px; }
  .qStat .n { font-size:26px; font-weight:700; letter-spacing:-.5px; font-variant-numeric:tabular-nums; }
  .qStat .k { font-size:11px; color:var(--muted2); margin-top:2px; letter-spacing:.3px; }

  .qPanel { background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .qHead { display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel2); flex-wrap:wrap; }
  .qHead .t { font-size:13px; font-weight:600; color:var(--text); }
  .qHead .s { font-size:12px; color:var(--muted2); }
  .refreshBtn { background:transparent; border:1px solid #2a3a48; color:var(--muted);
    border-radius:8px; padding:7px 13px; font-size:12px; font-weight:600; cursor:pointer; }
  .refreshBtn:hover { border-color:var(--accent); color:var(--accent); }

  .qRow { display:grid; grid-template-columns:38px 96px minmax(200px,1.5fr) minmax(180px,1fr) 92px 104px;
    gap:14px; align-items:center; padding:13px 16px; border-bottom:1px solid var(--line); }
  .qRow:last-child { border-bottom:none; }
  .qRow.hdr { background:var(--panel2); font-size:11px; color:var(--muted2); letter-spacing:.3px; padding:9px 16px; }
  .qRow:not(.hdr):hover { background:#1a2734; }

  .qRank { font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600;
    color:var(--muted2); font-variant-numeric:tabular-nums; }
  .qRank.top { color:var(--red); }

  .qScoreN { font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600;
    font-variant-numeric:tabular-nums; }
  .qBar { height:4px; border-radius:4px; background:#22303c; margin-top:5px; overflow:hidden; }
  .qBar i { display:block; height:100%; border-radius:4px; }

  .qWho { font-size:14px; font-weight:600; }
  .qId { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--accent); }
  .qMsg { font-size:12px; color:var(--muted); margin-top:3px; line-height:1.45;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .qIssue { font-size:13px; color:#c9d4de; line-height:1.4; }
  .qChips { display:flex; gap:5px; margin-top:5px; flex-wrap:wrap; }
  .chip { font-size:10px; font-weight:600; padding:2px 7px; border-radius:5px;
    text-transform:capitalize; letter-spacing:.2px; }
  .chip.high { background:#3a1c1c; color:#f0a0a0; }
  .chip.medium { background:#3a2f18; color:#e8c67a; }
  .chip.low { background:#16301f; color:#7fd0a6; }
  .chip.negative { background:#3a1c1c; color:#f0a0a0; }
  .chip.neutral { background:#23303c; color:#a8b8c6; }
  .chip.positive { background:#16301f; color:#7fd0a6; }
  .chip.tier { background:#1e2c3c; color:#8fb6e8; }

  .qWait { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .qWait b { color:var(--text); font-weight:600; }
  .coachBtn { width:100%; background:var(--accent); color:#08111a; border:none; border-radius:7px;
    padding:8px 10px; font-size:12px; font-weight:700; cursor:pointer; }
  .coachBtn:hover { filter:brightness(1.08); }

  .qEmpty { padding:34px 16px; text-align:center; color:var(--muted); font-size:13px; }
  .qNote { margin-top:12px; font-size:12px; color:var(--muted2); line-height:1.6; }
  .qNote code { font-family:'IBM Plex Mono',monospace; color:var(--muted); }
  .backBtn { background:transparent; border:1px solid #2a3a48; color:var(--muted);
    border-radius:8px; padding:7px 13px; font-size:12px; font-weight:600; cursor:pointer; margin-right:10px; }
  .backBtn:hover { border-color:var(--accent); color:var(--accent); }

  @media (max-width:900px){
    .qRow { grid-template-columns:32px 76px 1fr; row-gap:8px; }
    .qRow > :nth-child(4), .qRow > :nth-child(5) { grid-column:3; }
    .qRow > :nth-child(6) { grid-column:1/-1; }
    .qRow.hdr { display:none; }
  }
</style>

<body>
<div id="root"></div>

<script>
/* ============================================================= *
 *  Config                                                       *
 * ============================================================= */
const API_BASE = "http://localhost:8000";

// Every data endpoint requires a session token. Demo mode gets one freely from
// /auth/demo; the agent interface gets one by signing in. Same auth path either
// way, so there is no unauthenticated branch to reach by accident.
function authHeaders(){
  const h={"Content-Type":"application/json"};
  if(state.token) h["Authorization"]="Bearer "+state.token;
  return h;
}

/* ============================================================= *
 *  Mock fallback — used only when the backend is unreachable,   *
 *  so a demo never shows a blank screen. Mirrors backend shape. *
 * ============================================================= */
/* ============================================================= *
 *  BM25 retrieval — a port of retrieval.py, over the same        *
 *  faqs.json. The offline path must rank the way the backend     *
 *  ranks; a mock with invented match percentages next to a real  *
 *  retriever is exactly the thing this feature removes.          *
 *  Constants below mirror retrieval.py — change both together.   *
 * ============================================================= */
const K1=1.5, B=0.75, FIELD_W={title:3,tags:2,body:1};
const MIN_SCORE=3.0, MIN_SCORE_PER_TERM=1.8, EXPANSION_W=0.45, FLOOR_TERM_CAP=5;
const STOP=new Set(("a an the and or but if is are was were be been being to of in on at for with about as by from it its this that these those i me my we our you your he she they them their have has had do does did can could will would should there here what when where who how why not no so up out get got just very please hi hello").split(" "));
const SYN={money:["refund"],cash:["refund"],reimburse:["refund"],repay:["refund"],parcel:["package","shipping","delivery"],
  package:["shipping","delivery"],postage:["shipping"],courier:["carrier","shipping"],arrive:["delivery","shipping"],
  arrived:["delivery","shipping"],late:["delay","delayed"],waiting:["delay","delayed"],broken:["damaged","faulty"],
  cracked:["damaged"],smashed:["damaged"],shattered:["damaged"],crushed:["damaged"],faulty:["defect","technical"],
  defective:["defect","technical"],dead:["power","technical"],login:["sign","account"],password:["account","reset"],
  charged:["billing","charge"],billed:["billing","charge"],invoice:["billing","receipt"],swap:["exchange","returns"],
  replace:["replacement"],voucher:["promo","discount"],coupon:["promo","discount"],guarantee:["warranty"],
  repair:["technical","warranty"]};
const ORDER_ID_RE=/\b[a-z]{2,6}-\d{3,8}\b/gi;

function tok(text){
  const out=[];
  for(const w of String(text||"").toLowerCase().match(/[a-z0-9]+/g)||[]){
    if(STOP.has(w)||w.length<2)continue;
    let t=w;
    if(t.length>3&&t.endsWith("es")&&!t.endsWith("ses"))t=t.slice(0,-2);
    else if(t.length>3&&t.endsWith("s")&&!t.endsWith("ss"))t=t.slice(0,-1);
    out.push(t);
  }
  return out;
}
function buildQuery(q){
  const base=tok(String(q||"").replace(ORDER_ID_RE," "));
  const w={};
  for(const t of base) w[t]=1.0;
  for(const t of base) for(const s of (SYN[t]||[])) for(const st of tok(s)) if(!(st in w)) w[st]=EXPANSION_W;
  return {weights:w, nTerms:new Set(base).size};
}

let FAQ_INDEX=null;
function buildIndex(faqs){
  const docs=faqs.map(f=>{
    const t=[];
    for(const [field,wt] of Object.entries(FIELD_W)){
      const v=f[field], text=Array.isArray(v)?v.join(" "):String(v||"");
      for(let i=0;i<wt;i++) t.push(...tok(text));
    }
    const freqs={};
    for(const x of t) freqs[x]=(freqs[x]||0)+1;
    return {faq:f, freqs, len:t.length};
  });
  const df={};
  for(const d of docs) for(const term of Object.keys(d.freqs)) df[term]=(df[term]||0)+1;
  const avgdl=docs.reduce((s,d)=>s+d.len,0)/(docs.length||1);
  return {docs, df, n:docs.length, avgdl};
}
function faqSearch(query, k=3, category=null){
  if(!FAQ_INDEX) return null;               // corpus not loaded yet
  const {weights,nTerms}=buildQuery(query);
  if(!Object.keys(weights).length) return [];
  const floor=Math.max(MIN_SCORE, MIN_SCORE_PER_TERM*Math.min(Math.max(nTerms,1),FLOOR_TERM_CAP));
  const {docs,df,n,avgdl}=FAQ_INDEX;
  const scored=[];
  for(const d of docs){
    let s=0;
    for(const [term,w] of Object.entries(weights)){
      const f=d.freqs[term]; if(!f) continue;
      const idf=Math.log(1+(n-(df[term]||0)+0.5)/((df[term]||0)+0.5));
      s+=w*idf*(f*(K1+1))/(f+K1*(1-B+B*(d.len/(avgdl||1))));
    }
    if(s<=0) continue;
    if(category&&d.faq.category===category) s*=1.15;
    scored.push([s,d.faq]);
  }
  scored.sort((a,b)=> b[0]-a[0] || (a[1].id<b[1].id?-1:1));
  const out=[];
  for(const [s,faq] of scored.slice(0,k)){
    if(s<floor) break;
    out.push({id:faq.id,title:faq.title,body:faq.body,category:faq.category,score:Math.round(s*100)/100});
  }
  return out;
}
const MOCK_ORDERS = {
  "WORD-88221":{order_id:"WORD-88221",product:'Pro Laptop 16"',status:"refund_pending",days_since_refund_request:20,refund_amount:"$1,499.00",customer_tier:"Pro"},
  "WORD-10233":{order_id:"WORD-10233",product:"Wireless Mouse",status:"shipped",days_since_order:3,tracking:"TRK-556677",customer_tier:"Standard"},
};
const MOCK_POLICY = {
  refund:"Approved refunds process in 5–7 business days; escalate past 10.",
  shipping:"Standard 3–5 business days; tracking emailed on ship.",
  damaged:"Replacement or full refund; photo only for carrier claims.",
  technical:"12-month warranty on defects; route to technical support.",
  account:"Verify identity before changes; never ask for full passwords.",
};
// Order matters: first key wins an equal-hit tie, so the specific failure
// categories are tested before the generic ones. "The laptop arrived cracked"
// hits damaged and shipping once each — it is a damage case, not a delivery one.
const KW = {
  damaged:["damaged","broken","defective","cracked","shattered","crushed"],
  technical:["not working","won't turn on","error","crash","fault","warranty","nothing on screen"],
  account:["account","password","login","log in","sign in","reset","locked out"],
  refund:["refund","money back","reimburse","my money"],
  shipping:["shipping","ship","delivery","deliver","tracking","package","where is my order","arrive"],
};
function mockAnalyze(text){
  const t=text.toLowerCase();
  let issue=null,best=0;
  for(const[k,ws]of Object.entries(KW)){const h=ws.filter(w=>t.includes(w)).length;if(h>best){best=h;issue=k;}}
  const om=text.match(/WORD-\d{3,6}/i); const order_id=om?om[0].toUpperCase():null;
  // Keyword heuristics standing in for the real classifier. Three signal
  // families, because anger alone misses the customer who is calmly blocked:
  // ANGRY = how they sound, BLOCKED = whether they can still use the product,
  // SEVERE = physical/hard failure. Only ANGRY moves sentiment much; BLOCKED
  // and SEVERE drive urgency. The live backend does this properly.
  const bang=(text.match(/!/g)||[]).length;
  const ANGRY=["ridiculous","unacceptable","furious","worst","terrible","frustrat","disappointed","still waiting"];
  const BLOCKED=["stuck","won't turn on","not working","nothing on screen","unable to",
                 "can't sign in","can't log in","cannot access","locked out","never arrives","never arrived"];
  const SEVERE=["cracked","crushed","damaged","broken","shattered","defective","dead"];
  const TIME=["immediately","asap","urgent","today","deadline","before","20 days","how much longer","still waiting"];

  const angry=ANGRY.filter(w=>t.includes(w)).length;
  const blocked=BLOCKED.filter(w=>t.includes(w)).length;
  const severe=SEVERE.filter(w=>t.includes(w)).length;
  const timed=TIME.filter(w=>t.includes(w)).length;

  const negScore=angry+bang*0.5+blocked*0.75+severe*0.5;
  const calm=/(no rush|no hurry|just planning|whenever)/.test(t);
  const sentiment=negScore>=1.5?"negative"
    :(/(thanks|appreciate|please)/.test(t)||calm)&&negScore<0.5?"positive":"neutral";

  const uh=timed+bang*0.4+blocked*0.75+severe*0.5-(calm?1:0);
  const urgency=uh>=1.5?"high":uh>=0.75?"medium":"low";

  const sc=(sentiment==="negative"?2:sentiment==="neutral"?1:0)+(urgency==="high"?2:urgency==="medium"?1:0);
  const escalation_risk=sc>=3?"high":sc>=2?"medium":"low";
  const key_issue={refund:"Refund delay / money-back request",shipping:"Shipping / delivery status",damaged:"Damaged item on arrival",technical:"Product fault / warranty",account:"Account access / change"}[issue]||"General inquiry — needs classification";
  const order=order_id?MOCK_ORDERS[order_id]||null:null;
  const policy=issue?MOCK_POLICY[issue]:null;
  const faqs=faqSearch(text,3,issue);   // real BM25, same corpus as the backend
  let reply="Thanks for reaching out — happy to help. ";
  if(sentiment==="negative")reply="I'm sorry for the frustration, and you're right to expect better. ";
  if(issue==="refund"&&order)reply+=`I can see the refund on ${order.order_id} (${order.refund_amount}) has been pending ${order.days_since_refund_request} days — past the 5–7 day window, so I'm escalating to billing now.`;
  else if(issue==="refund")reply+="Approved refunds take 5–7 business days; I'll check exactly where yours stands.";
  else if(issue==="shipping"&&order)reply+=`Order ${order.order_id} shipped on tracking ${order.tracking}; standard delivery is 3–5 days.`;
  else if(issue==="shipping")reply+="Standard delivery is 3–5 business days and tracking is emailed on ship. I'll confirm your status.";
  else if(issue==="damaged")reply+="For a damaged item I can arrange a replacement or full refund right away.";
  else if(issue==="technical")reply+="This may be a warranty-covered fault; I can start a diagnostic under the 12-month warranty.";
  else if(issue==="account")reply+="I can help once I've verified your identity — I'll never ask for your full password.";
  else reply+="Let me get a couple of details so I can point you to the right fix.";
  return {sentiment,urgency,escalation_risk,key_issue,order_id,issue_type:issue,order,policy,faqs,
    order_found:!!order,policy_found:!!policy,suggested_reply:reply};
}
function mockEvaluate(){return {tone_score:5,empathy_score:4,clarity_score:6,coaching_tip:"Acknowledge the specific delay before setting expectations."};}

/* ============================================================= *
 *  Ticket queue — mock backlog + priority scoring                *
 *  Mirrors coach.py: TICKETS, priority_score(), TicketQueue.     *
 * ============================================================= */
const MOCK_TICKETS = [
  {ticket_id:"TCK-4471",customer:"R. Mehta",customer_tier:"Pro",waiting_minutes:1740,
   message:"I have been waiting for my refund on order WORD-88221 for 20 days! This is ridiculous. I want my money back immediately!"},
  {ticket_id:"TCK-4468",customer:"S. Okonkwo",customer_tier:"Standard",waiting_minutes:95,
   message:"Where is my package for order WORD-10233? It was supposed to arrive already."},
  {ticket_id:"TCK-4472",customer:"L. Fontaine",customer_tier:"Pro",waiting_minutes:22,
   message:"The laptop arrived with a cracked screen. The box was crushed on one corner. I need this sorted before my trip on Friday."},
  {ticket_id:"TCK-4460",customer:"D. Whitfield",customer_tier:"Standard",waiting_minutes:2880,
   message:"Hi, could you tell me how long express shipping usually takes? No rush, just planning ahead."},
  {ticket_id:"TCK-4475",customer:"A. I'lic",customer_tier:"Pro",waiting_minutes:8,
   message:"My laptop won't turn on at all after the last update. Nothing on screen. I use this for work and I'm completely stuck."},
  {ticket_id:"TCK-4463",customer:"K. Nakamura",customer_tier:"Standard",waiting_minutes:610,
   message:"I can't sign in to my account and the password reset email never arrives. Can you help me get back in?"},
];

// Same weights and point budget as coach.py — keep these in sync.
const RISK_W={high:1.0,medium:0.55,low:0.15};
const URGENCY_W={high:1.0,medium:0.55,low:0.15};
const SENTIMENT_W={negative:1.0,neutral:0.4,positive:0.0};
const TIER_W={pro:1.0,standard:0.45};
const POINTS={risk:40,urgency:30,sentiment:15,tier:10,age:5};
const AGE_SATURATES=48*60;

function priorityScore(a,t){
  const parts={
    risk:     Math.round(POINTS.risk      * (RISK_W[(a.escalation_risk||"").toLowerCase()] ?? 0.15)),
    urgency:  Math.round(POINTS.urgency   * (URGENCY_W[(a.urgency||"").toLowerCase()] ?? 0.15)),
    sentiment:Math.round(POINTS.sentiment * (SENTIMENT_W[(a.sentiment||"").toLowerCase()] ?? 0.4)),
    tier:     Math.round(POINTS.tier      * (TIER_W[(t.customer_tier||"").toLowerCase()] ?? 0.45)),
    age:      Math.round(POINTS.age       * Math.min((t.waiting_minutes||0)/AGE_SATURATES,1)),
  };
  return {score:Object.values(parts).reduce((x,y)=>x+y,0), parts};
}

function mockQueue(){
  // The backend drains a real binary heap (coach.py TicketQueue). Sorting on the
  // identical key here reproduces that exact order without a second heap impl.
  const rows=MOCK_TICKETS.map(t=>{
    const a=mockAnalyze(t.message);
    const {score,parts}=priorityScore(a,t);
    return {...t,sentiment:a.sentiment,urgency:a.urgency,escalation_risk:a.escalation_risk,
            key_issue:a.key_issue,order_id:a.order_id,issue_type:a.issue_type,
            priority_score:score,score_parts:parts};
  });
  rows.sort((x,y)=> y.priority_score-x.priority_score || y.waiting_minutes-x.waiting_minutes);
  rows.forEach((r,i)=>r.rank=i+1);
  return {tickets:rows,count:rows.length};
}

let connMode = "checking"; // live | mock | checking
let mockReason = "backend offline"; // why we're on the mock, shown in the status pill
async function checkHealth(){
  try{
    const r=await fetch(API_BASE+"/health",{signal:AbortSignal.timeout(2500)});
    // /health answers 200 even with no API key, but a keyless backend can't
    // actually analyse anything — every call would fall through to the mock.
    // Treat that as mock so the status dot never claims "live" over mock output.
    const h = r.ok ? await r.json() : null;
    connMode = (h && h.key_set) ? "live" : "mock";
    if(connMode==="mock") mockReason = h ? "no GROQ_API_KEY" : "backend offline";
  }catch{ connMode="mock"; mockReason="backend offline"; }
  render();
}
async function apiAnalyze(message,history,ticket_id){
  if(connMode==="live"){
    try{
      const r=await fetch(API_BASE+"/analyze",{method:"POST",headers:authHeaders(),
        body:JSON.stringify({message,history,ticket_id})});
      if(!r.ok)throw new Error(await r.text());
      return await r.json();
    }catch(e){ connMode="mock"; mockReason="backend error"; render(); return mockAnalyze(message); }
  }
  return mockAnalyze(message);
}
async function apiEvaluate(customer_message,agent_message,ticket_id){
  if(connMode==="live"){
    try{
      const r=await fetch(API_BASE+"/evaluate",{method:"POST",headers:authHeaders(),
        body:JSON.stringify({customer_message,agent_message,ticket_id,
          sentiment_before:(state.analysis||{}).sentiment,
          issue_type:(state.analysis||{}).issue_type,
          escalation_risk:(state.analysis||{}).escalation_risk})});
      if(!r.ok)throw new Error(await r.text());
      return await r.json();
    }catch{ connMode="mock"; mockReason="backend error"; render(); return mockEvaluate(); }
  }
  return mockEvaluate();
}

async function apiQueue(){
  if(connMode==="live"){
    try{
      const r=await fetch(API_BASE+"/queue",{headers:authHeaders(),signal:AbortSignal.timeout(60000)});
      if(!r.ok)throw new Error(await r.text());
      return await r.json();
    }catch{ connMode="mock"; mockReason="backend error"; render(); return mockQueue(); }
  }
  return mockQueue();
}

const SIG={high:"var(--red)",negative:"var(--red)",medium:"var(--amber)",neutral:"var(--muted2)",low:"var(--green)",positive:"var(--green)"};
const state={
  mode:null,                 // null = landing | "demo" | "agent"
  token:null, agent:null,    // session
  loginEmail:"", loginPassword:"", loginError:"", loggingIn:false,
  analytics:null, analyticsLoading:false,
  screen:"queue",            // queue | coach | perf
  view:"split",
  query:"I have been waiting for my refund on order WORD-88221 for 20 days! This is ridiculous. I want my money back immediately!",
  draftInput:"",
  analysis:null, suggested:"", editedReply:"", sent:false, loading:false,
  feedback:null,
  tickets:[], queueLoading:false, activeTicket:null,
  thread:[],                 // full conversation for the open ticket
  resolved:new Set(),        // ticket ids handled this session
  resolvedCount:0,
};

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

async function runAnalysis(){
  state.loading=true; render();
  const tid=state.activeTicket ? state.activeTicket.ticket_id : null;
  // On the mock path there is no server thread, so send the local one.
  const localHist=state.thread.map(m=>({speaker:m.speaker,text:m.text}));
  const a=await apiAnalyze(state.query,localHist,tid);
  state.analysis=a; state.suggested=a.suggested_reply; state.editedReply=a.suggested_reply;
  // The server's stored thread wins when there is one; it survives refresh.
  if(a.history && a.history.length) state.thread=a.history;
  else if(!state.thread.some(m=>m.speaker==="customer"&&m.text===state.query))
    state.thread=[...state.thread,{speaker:"customer",text:state.query}];
  state.sent=false; state.feedback=null; state.loading=false; render();
}

async function enterDemo(){
  try{
    const r=await fetch(API_BASE+"/auth/demo",{method:"POST",headers:{"Content-Type":"application/json"}});
    if(r.ok){ const d=await r.json(); state.token=d.token; state.agent=d.agent; }
  }catch{ /* backend down: demo still runs on the built-in mock */ }
  state.mode="demo"; state.screen="queue"; render(); loadQueue();
}

function enterAgent(){ state.mode="agent"; state.screen="queue"; render(); }

async function doLogin(){
  if(state.loggingIn) return;
  state.loginError=""; state.loggingIn=true; render();
  try{
    const r=await fetch(API_BASE+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:state.loginEmail.trim(),password:state.loginPassword})});
    if(!r.ok){
      const d=await r.json().catch(()=>({}));
      state.loginError=d.detail||"Sign-in failed."; state.loggingIn=false; render(); return;
    }
    const d=await r.json();
    state.token=d.token; state.agent=d.agent;
    state.loginPassword=""; state.loggingIn=false;
    state.screen="queue"; render(); loadQueue();
  }catch{
    state.loginError="Cannot reach the backend. Start it on port 8000 and try again.";
    state.loggingIn=false; render();
  }
}

function signOut(){
  state.token=null; state.agent=null; state.mode=null;
  state.tickets=[]; state.analytics=null; state.analysis=null;
  state.activeTicket=null; state.thread=[]; state.screen="queue";
  render();
}

async function loadAnalytics(){
  state.analyticsLoading=true; render();
  try{
    const r=await fetch(API_BASE+"/analytics",{headers:authHeaders()});
    state.analytics = r.ok ? await r.json() : null;
  }catch{ state.analytics=null; }
  state.analyticsLoading=false; render();
}

function setView(v){state.view=v;render();}
function setScreen(s){
  state.screen=s; render();
  if(s==="queue"&&!state.tickets.length&&!state.queueLoading)loadQueue();
  if(s==="coach"&&!state.analysis&&!state.loading)runAnalysis();
  if(s==="perf")loadAnalytics();
}

async function loadQueue(){
  state.queueLoading=true; render();
  const q=await apiQueue();
  state.tickets=q.tickets||[]; state.resolvedCount=q.resolved_count||0;
  state.queueLoading=false; render();
}

// Pick a ticket off the queue and open it in the coaching workspace.
function coachTicket(id){
  const t=state.tickets.find(x=>x.ticket_id===id);
  if(!t)return;
  state.activeTicket=t;
  state.query=t.message;
  state.thread=[];              // cleared; runAnalysis adopts the server thread
  state.screen="coach"; state.view="split";
  runAnalysis();
}

function fmtWait(m){
  if(m<60)return m+"m";
  if(m<1440)return Math.floor(m/60)+"h "+(m%60?(m%60)+"m":"");
  return Math.floor(m/1440)+"d "+(Math.floor(m%1440/60)||0)+"h";
}
function scoreColor(s){ return s>=75?"var(--red)":s>=45?"var(--amber)":"var(--green)"; }
function submitQuery(){
  if(!state.draftInput.trim())return;
  state.query=state.draftInput.trim(); state.draftInput="";
  if(state.view==="customer")state.view="split";
  runAnalysis();
}
async function sendReply(){
  state.sent=true;
  const tid=state.activeTicket ? state.activeTicket.ticket_id : null;
  state.thread=[...state.thread,{speaker:"agent",text:state.editedReply}];
  render();
  const fb=await apiEvaluate(state.query,state.editedReply,tid);
  state.feedback=fb;
  if(fb.history && fb.history.length) state.thread=fb.history;
  // Answered means handled: the ticket leaves the queue. A new customer
  // message reopens it server-side, so this is not a one-way door.
  if(tid){
    state.resolved.add(tid);
    state.tickets=state.tickets.filter(t=>t.ticket_id!==tid)
                               .map((t,i)=>({...t,rank:i+1}));
  }
  render();
}

async function reopenTicket(id){
  if(connMode==="live"){
    try{ await fetch(API_BASE+"/tickets/"+encodeURIComponent(id)+"/reopen",{method:"POST",headers:authHeaders()}); }catch{}
  }
  state.resolved.delete(id);
  loadQueue();
}

function cell(label,value){
  const c=SIG[(value||"").toLowerCase()]||"var(--muted2)";
  return `<div class="cell"><div class="lbl">${label}</div>
    <div class="val"><span class="sig" style="background:${c};box-shadow:0 0 8px ${c}88"></span>${esc(value||"—")}</div></div>`;
}

function queueScreen(){
  const ts=state.tickets;
  const high=ts.filter(t=>(t.escalation_risk||"").toLowerCase()==="high").length;
  const longest=ts.reduce((m,t)=>Math.max(m,t.waiting_minutes||0),0);
  const top=ts[0];

  const rows = state.queueLoading
    ? `<div class="qEmpty">Analyzing the backlog… one pass per ticket.</div>`
    : !ts.length
      ? `<div class="qEmpty">No open tickets.</div>`
      : `<div class="qRow hdr"><div>#</div><div>Priority</div><div>Customer</div>
           <div>Issue</div><div>Waiting</div><div></div></div>` +
        ts.map(t=>`
        <div class="qRow">
          <div class="qRank ${t.rank===1?"top":""}">${t.rank}</div>
          <div>
            <div class="qScoreN" style="color:${scoreColor(t.priority_score)}">${t.priority_score}</div>
            <div class="qBar"><i style="width:${t.priority_score}%;background:${scoreColor(t.priority_score)}"></i></div>
          </div>
          <div>
            <div class="qWho">${esc(t.customer)} <span class="qId">${esc(t.ticket_id)}</span></div>
            <div class="qMsg">${esc(t.message)}</div>
          </div>
          <div>
            <div class="qIssue">${esc(t.key_issue||"—")}</div>
            <div class="qChips">
              <span class="chip ${(t.escalation_risk||"").toLowerCase()}">risk ${esc(t.escalation_risk||"?")}</span>
              <span class="chip ${(t.urgency||"").toLowerCase()}">${esc(t.urgency||"?")} urgency</span>
              <span class="chip ${(t.sentiment||"").toLowerCase()}">${esc(t.sentiment||"?")}</span>
              <span class="chip tier">${esc(t.customer_tier)}</span>
            </div>
          </div>
          <div class="qWait"><b>${fmtWait(t.waiting_minutes)}</b>${t.turns?`<div style="font-size:11px;color:var(--muted2);margin-top:3px">${t.turns} turn${t.turns>1?"s":""}</div>`:""}</div>
          <div><button class="coachBtn" onclick="coachTicket('${esc(t.ticket_id)}')">Coach this</button></div>
        </div>`).join("");

  return `
    <div class="qStats">
      <div class="qStat"><div class="n">${ts.length}</div><div class="k">OPEN TICKETS</div></div>
      <div class="qStat"><div class="n" style="color:var(--green)">${state.resolvedCount||state.resolved.size}</div>
        <div class="k">RESOLVED${(state.resolvedCount||state.resolved.size)?" · left the queue":""}</div></div>
      <div class="qStat"><div class="n" style="color:var(--red)">${high}</div><div class="k">HIGH ESCALATION RISK</div></div>
      <div class="qStat"><div class="n">${longest?fmtWait(longest):"—"}</div><div class="k">LONGEST WAIT</div></div>
      <div class="qStat"><div class="n" style="color:${top?scoreColor(top.priority_score):"var(--muted2)"}">${top?top.priority_score:"—"}</div>
        <div class="k">TOP PRIORITY ${top?"· "+esc(top.ticket_id):""}</div></div>
    </div>
    <div class="qPanel">
      <div class="qHead">
        <div>
          <div class="t">Ticket queue</div>
          <div class="s">Ordered by a priority heap — highest score first, longest wait breaks ties.</div>
        </div>
        <button class="refreshBtn" onclick="loadQueue()" ${state.queueLoading?"disabled":""}>
          ${state.queueLoading?"Working…":"Re-analyze queue"}</button>
      </div>
      ${rows}
    </div>
    <div class="qNote">
      Score is <code>risk 40 · urgency 30 · sentiment 15 · tier 10 · wait 5</code> = 100.
      Risk, urgency and sentiment come from analyzing each message; tier and wait time come
      from the ticket record. Waiting time saturates at 48h so age can't outrank real risk —
      which is why the oldest ticket here is not the top one.
    </div>`;
}

/* ---------- chart primitives: hand-authored SVG, no libraries ---------- */

// Column chart. One series, so no legend — the card title names it.
function barChart(data, w=1200, h=150){
  const max=Math.max(1,...data.map(d=>d.count));
  const n=data.length, gap=8, bw=Math.max(3,(w-gap*(n-1))/n);
  const bars=data.map((d,i)=>{
    const bh=d.count?Math.max(4,(d.count/max)*(h-34)):0;
    const x=i*(bw+gap), y=h-28-bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}"
      rx="4" fill="var(--accent)" opacity="${d.count?1:0}"><title>${d.date}: ${d.count} handled</title></rect>`;
  }).join("");
  const ticks=[data[0],data[data.length-1]].filter(Boolean).map((d,i)=>
    `<text x="${i?w:0}" y="${h-6}" text-anchor="${i?"end":"start"}" font-size="13" fill="var(--muted2)">${d.date.slice(5)}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="Tickets handled per day over the last ${n} days">
    <line x1="0" y1="${h-28}" x2="${w}" y2="${h-28}" stroke="var(--line)" stroke-width="1"/>
    ${bars}${ticks}</svg>`;
}

// 100% stacked bar for a three-state polarity split. Status colours, each
// directly labelled, so identity never rests on colour alone.
function shiftBar(shift, w=1200, h=48){
  const total=shift.measured||0;
  if(!total) return "";
  const segs=[
    {k:"calmed",   v:shift.calmed,    c:"var(--green)"},
    {k:"unchanged",v:shift.unchanged, c:"#6f8090"},
    {k:"escalated",v:shift.escalated, c:"var(--red)"},
  ].filter(s=>s.v>0);
  let x=0;
  const rects=segs.map(s=>{
    const sw=(s.v/total)*w;
    const r=`<rect x="${x.toFixed(1)}" y="0" width="${Math.max(0,sw-2).toFixed(1)}" height="24" rx="5" fill="${s.c}"><title>${s.k}: ${s.v} of ${total}</title></rect>`;
    const label=sw>130?`<text x="${(x+sw/2-1).toFixed(1)}" y="43" text-anchor="middle" font-size="14" fill="var(--muted)">${s.k} ${s.v}</text>`:"";
    x+=sw; return r+label;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="Customer sentiment after the agent replied">${rects}</svg>`;
}

// Sparkline for one score over time. Nulls are gaps, not zeros — a day with no
// tickets is missing data, and plotting it as 0 would invent a bad score.
function sparkline(series, w=340, h=96){
  const pts=series.map((v,i)=>({v,i})).filter(p=>p.v!=null);
  if(pts.length===0) return `<div style="height:${h}px;display:grid;place-items:center;font-size:11px;color:var(--muted2)">no data yet</div>`;
  const n=series.length, min=0, max=10;
  const pad=9;
  const X=i=>pad+(i/Math.max(1,n-1))*(w-2*pad), Y=v=>h-pad-((v-min)/(max-min))*(h-2*pad);
  if(pts.length===1){
    const p=pts[0];
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" role="img" aria-label="single measurement of ${p.v} out of 10">
      <circle cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="6" fill="var(--accent)"/></svg>`;
  }
  const d=pts.map((p,k)=>`${k?"L":"M"}${X(p.i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" role="img" aria-label="trend, latest ${last.v} out of 10">
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last.i).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="6" fill="var(--accent)" stroke="var(--base)" stroke-width="3"/></svg>`;
}

function hbars(obj, colorFor){
  const entries=Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]);
  if(!entries.length) return "";
  const max=Math.max(...entries.map(e=>e[1]));
  return entries.map(([k,v])=>`
    <div class="hbar">
      <span style="text-transform:capitalize">${esc(k)}</span>
      <span class="track"><span class="fill" style="width:${(v/max*100).toFixed(0)}%;background:${colorFor?colorFor(k):"var(--accent)"}"></span></span>
      <span class="num">${v}</span>
    </div>`).join("");
}

const RISK_COLOR = k => k==="high"?"var(--red)":k==="medium"?"var(--amber)":k==="low"?"var(--green)":"#6f8090";

function perfScreen(){
  const a=state.analytics;
  if(state.analyticsLoading&&!a) return `<div class="card"><div class="empty">Loading your activity…</div></div>`;
  if(!a) return `<div class="card"><div class="empty">Could not load analytics. Is the backend running?</div></div>`;

  const s=a.sentiment_shift, measured=s.measured;
  const calmedPct = measured ? Math.round(s.calmed/measured*100) : null;

  if(a.handled===0) return `
    <div class="card wide">
      <div class="cardTitle">Your performance</div>
      <div class="cardNote">Built from tickets you handle — there is no seeded history, so this starts empty.</div>
      <div class="empty">
        <b>No handled tickets yet.</b><br/>
        Work a ticket from the Queue and send a reply. This dashboard will then show
        your volume, coaching scores, issue mix, and whether customers calmed down
        after your replies.
      </div>
    </div>`;

  return `
  <div class="perfGrid">
    <div class="card">
      <div class="cardTitle">Tickets handled</div>
      <div class="cardNote">All time, by you</div>
      <div class="smValue" style="font-size:34px">${a.handled}</div>
    </div>
    <div class="card">
      <div class="cardTitle">Handled today</div>
      <div class="cardNote">Busiest day in range: ${a.busiest_day}</div>
      <div class="smValue" style="font-size:34px">${a.today}</div>
    </div>
    <div class="card">
      <div class="cardTitle">Average coaching score</div>
      <div class="cardNote">Mean of tone, empathy and clarity</div>
      <div class="smValue" style="font-size:34px">${a.scores.overall}<span> / 10</span></div>
    </div>
    <div class="card">
      <div class="cardTitle">Customers calmed</div>
      <div class="cardNote">${measured?`of ${measured} ticket${measured>1?"s":""} where the customer replied`:"awaiting a customer reply"}</div>
      <div class="smValue" style="font-size:34px;color:${calmedPct==null?"var(--muted2)":calmedPct>=50?"var(--green)":"var(--amber)"}">
        ${calmedPct==null?"—":calmedPct+"%"}</div>
    </div>

    <div class="card wide">
      <div class="cardTitle">Did the customer calm down after your reply?</div>
      <div class="cardNote">
        Compares how the customer sounded before your reply against their next message.
        ${measured
          ? `Measured on ${measured} of ${a.handled} handled ticket${a.handled>1?"s":""} — only tickets where the customer wrote back can be measured.`
          : `Not measurable yet: no customer has replied since you answered. Send a follow-up as the customer in the Coaching tab to see this fill in.`}
      </div>
      ${measured ? shiftBar(s) + `
        <div class="legend">
          <span><i class="swatch" style="background:var(--green)"></i>Calmed ${s.calmed}</span>
          <span><i class="swatch" style="background:#6f8090"></i>Unchanged ${s.unchanged}</span>
          <span><i class="swatch" style="background:var(--red)"></i>Escalated ${s.escalated}</span>
        </div>`
      : `<div class="empty">Nothing measured yet.</div>`}
    </div>

    <div class="card wide">
      <div class="cardTitle">Tickets handled per day</div>
      <div class="cardNote">Last 14 days</div>
      ${barChart(a.volume)}
    </div>

    <div class="card wide">
      <div class="cardTitle">Coaching scores over time</div>
      <div class="cardNote">Daily average out of 10. Gaps are days you handled nothing — not zero scores.</div>
      <div class="smallMult">
        ${["tone","empathy","clarity"].map(k=>`
          <div class="smBox">
            <div class="smLabel" style="text-transform:capitalize">${k}</div>
            <div class="smValue">${a.scores[k]}<span> / 10</span></div>
            ${sparkline(a.score_trend.map(d=>d[k]))}
          </div>`).join("")}
      </div>
    </div>

    <div class="card">
      <div class="cardTitle">Issues you handled</div>
      <div class="cardNote">By issue type</div>
      ${hbars(a.by_issue)||`<div class="empty">No data.</div>`}
    </div>

    <div class="card">
      <div class="cardTitle">Escalation risk you took on</div>
      <div class="cardNote">Risk level of the tickets you picked up</div>
      ${hbars(a.by_risk,RISK_COLOR)||`<div class="empty">No data.</div>`}
    </div>

    <div class="card wide">
      <div class="cardTitle">Your most frequent coaching tips</div>
      <div class="cardNote">Repeated advice is the habit worth changing</div>
      ${a.top_tips.length
        ? a.top_tips.map(t=>`<div class="tipRow"><span class="tipCount">x${t.count}</span><span>${esc(t.tip)}</span></div>`).join("")
        : `<div class="empty">No tips yet.</div>`}
    </div>
  </div>`;
}

function render(){
  const root=document.getElementById("root");

  // Mode gate. Landing first, then sign-in for the agent interface. Nothing
  // below renders until one of those is satisfied.
  if(state.mode===null){ root.innerHTML=landingScreen(); return; }
  if(state.mode==="agent" && !state.token){ root.innerHTML=loginScreen(); focusLogin(); return; }

  const a=state.analysis;
  const showC=state.view==="customer"||state.view==="split";
  const showA=state.view==="agent"||state.view==="split";
  const connLabel=connMode==="live"?"Live backend":connMode==="mock"?`Mock (${mockReason})`:"Connecting…";
  const connClass=connMode==="live"?"live":connMode==="mock"?"mock":"";

  const customerPanel = showC ? `
    <section class="panel">
      <div class="panelLabel">Customer</div>
      <div class="chat">
        ${state.thread.length
          ? state.thread.map(m=>`<div class="${m.speaker==="agent"?"bAgent":"bCust"}">${esc(m.text)}</div>`).join("")
          : `<div class="bCust">${esc(state.query)}</div>`}
      </div>
      <div class="composer">
        <textarea id="draft" rows="3" placeholder="Type a customer message…  (⌘/Ctrl+Enter to send)">${esc(state.draftInput)}</textarea>
        <button class="sendBtn" onclick="submitQuery()">Send message</button>
      </div>
    </section>` : "";

  let agentPanel="";
  if(showA){
    const inner = !a ? `<div style="padding:24px;color:var(--muted)">Send a customer message to see analysis.</div>` : `
      <div class="risk">
        ${cell("Sentiment",a.sentiment)}
        ${cell("Urgency",a.urgency)}
        ${cell("Escalation risk",a.escalation_risk)}
        <div class="cell" style="flex:1.4"><div class="lbl">Key issue</div>
          <div style="font-size:14px;font-weight:500">${esc(a.key_issue)}</div></div>
      </div>
      <div class="agentBody">
        <div class="ground">
          <div class="secTitle">Matched knowledge</div>
          ${a.faqs&&a.faqs.length?a.faqs.map(f=>`
            <div class="faq">
              <div class="faqTop"><span class="faqId">${esc(f.id)}</span><span class="faqMatch">BM25 ${f.score}</span></div>
              <div class="faqTitle">${esc(f.title)}</div>
              <div class="faqBody">${esc(f.body)}</div>
            </div>`).join("")
            :`<div class="faqEmpty">No strong FAQ match. Classify the issue or escalate to a human agent.</div>`}
          ${a.order?`<div class="order"><div class="secTitle">Order on file</div>
            <div class="orderRow"><span>Order</span><b>${esc(a.order.order_id)}</b></div>
            <div class="orderRow"><span>Product</span><b>${esc(a.order.product)}</b></div>
            <div class="orderRow"><span>Status</span><b>${esc((a.order.status||"").replace(/_/g," "))}</b></div>
            ${a.order.refund_amount?`<div class="orderRow"><span>Amount</span><b>${esc(a.order.refund_amount)}</b></div>`:""}
            ${"days_since_refund_request"in a.order?`<div class="orderRow"><span>Pending</span><b>${a.order.days_since_refund_request} days</b></div>`:""}
            ${a.order.tracking?`<div class="orderRow"><span>Tracking</span><b>${esc(a.order.tracking)}</b></div>`:""}
            <div class="orderRow"><span>Tier</span><b>${esc(a.order.customer_tier)}</b></div></div>`:""}
        </div>
        <div class="reply">
          <div class="secTitle">Suggested reply · editable</div>
          <textarea class="replyBox" id="replyBox" oninput="state.editedReply=this.value">${esc(state.editedReply)}</textarea>
          <div class="replyActions">
            <button class="ghost" onclick="state.editedReply=state.suggested;render()" ${state.editedReply===state.suggested?"disabled":""}>Reset to suggestion</button>
            <button class="primary" onclick="sendReply()">${state.sent?"Sent ✓":"Send to customer"}</button>
          </div>
          ${state.feedback?`<div class="scoreStrip">
            <span class="score">Tone <b>${state.feedback.tone_score}</b>/10</span>
            <span class="score">Empathy <b>${state.feedback.empathy_score}</b>/10</span>
            <span class="score">Clarity <b>${state.feedback.clarity_score}</b>/10</span>
          </div><div class="tip">💡 ${esc(state.feedback.coaching_tip)}</div>`:""}
          ${a.policy?`<div class="policyNote"><span class="policyTag">Grounded in policy</span>${esc(a.policy)}</div>`:""}
        </div>
      </div>`;
    agentPanel=`<section class="panel">
      <div class="panelLabel">Agent workspace ${state.loading?'<span class="spinner">analyzing…</span>':""}</div>
      ${inner}</section>`;
  }

  const onQueue = state.screen==="queue";
  const onPerf  = state.screen==="perf";
  const isAgent = state.mode==="agent";
  const sub = onPerf
    ? "Your performance · live activity only"
    : onQueue
    ? "Ticket queue · priority-ordered"
    : state.activeTicket
      ? `Coaching ${state.activeTicket.ticket_id} · ${state.activeTicket.customer}`
      : "Live response guidance · demo";

  document.getElementById("root").innerHTML=`
    <header>
      <div><div class="brand">Support Coach</div><div class="sub">${esc(sub)}</div></div>
      <div class="controls">
        <div class="conn"><span class="dot ${connClass}"></span>${connLabel}</div>
        <div class="toggle">
          <button class="${onQueue?"active":""}" onclick="setScreen('queue')">Queue</button>
          <button class="${state.screen==="coach"?"active":""}" onclick="setScreen('coach')">Coaching</button>
          ${isAgent?`<button class="${onPerf?"active":""}" onclick="setScreen('perf')">Agent dashboard</button>`:""}
        </div>
        ${isAgent&&state.agent?`<div class="who">
          <span class="avatar">${esc((state.agent.name||"A").split(" ").map(x=>x[0]).join("").slice(0,2))}</span>
          <span>${esc(state.agent.name)}</span>
          <button class="linkBtn" onclick="signOut()">Sign out</button>
        </div>`:`<button class="linkBtn" onclick="signOut()">Exit demo</button>`}
        ${(onQueue||onPerf)?"":`<div class="toggle">
          ${["customer","split","agent"].map(v=>`<button class="${state.view===v?"active":""}" onclick="setView('${v}')">${v==="customer"?"Customer":v==="agent"?"Agent":"Both"}</button>`).join("")}
        </div>`}
      </div>
    </header>
    ${onPerf ? perfScreen() : onQueue ? queueScreen() : `
      ${state.activeTicket?`<div style="margin-bottom:12px"><button class="backBtn" onclick="setScreen('queue')">← Back to queue</button></div>`:""}
      <div class="stage" style="grid-template-columns:${state.view==="split"?"1fr 1.4fr":"1fr"}">
        ${customerPanel}${agentPanel}
      </div>`}`;

  // rebind draft textarea value + shortcut
  const d=document.getElementById("draft");
  if(d){
    d.oninput=e=>{state.draftInput=e.target.value;};
    d.onkeydown=e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))submitQuery();};
  }
}

// boot — await the health check first, otherwise connMode is still "checking"
// when the first request fires and it silently uses the mock on a live backend.
(async ()=>{
  // Same corpus the backend indexes, served from this folder.
  try{
    const r=await fetch('faqs.json');
    if(r.ok) FAQ_INDEX=buildIndex(await r.json());
  }catch{ /* leaves FAQ_INDEX null; cards show as unavailable */ }
  await checkHealth();   // renders the landing screen; no queue call until a mode is picked
})();
</script>
</body>
</html>
